[package]
name = "doppelcore"
version = "0.1.0"
edition = "2021"
publish = false
license = "Proprietary"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
